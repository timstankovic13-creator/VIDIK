name: Unbounded Intervention Universe Validation

on:
  push:
    paths:
      - 'tests/unbounded-intervention-universe.test.js'
      - 'js/decision-discovery-execution.js'
      - 'js/decision-discovery-orchestrator.js'
      - 'js/intervention-discovery.js'
      - 'js/discovery-transfer-intelligence.js'
      - '.github/workflows/unbounded-intervention-universe.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test tests/unbounded-intervention-universe.test.js
