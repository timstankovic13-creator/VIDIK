name: VIDIK Focused Blocked-Case Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_VERSION: 24
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: node --test tests/focused-blocked-case-diagnostic.test.js
