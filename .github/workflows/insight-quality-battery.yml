name: VIDIK Insight Quality Battery

on:
  push:
    branches: [main]
    paths:
      - 'tests/insight-quality-battery.test.js'
      - 'js/**'
      - 'package.json'
      - '.github/workflows/insight-quality-battery.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  insight-quality-battery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Run 60-case Insight Quality Battery
        run: npm run test:insight-quality-battery
