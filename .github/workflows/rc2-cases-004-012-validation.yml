name: VIDIK RC2 Cases 004-012 Validation

on:
  push:
    branches: [rc2-cases-004-012-validation]
  pull_request:
    branches: [main]

jobs:
  cases-004-012-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run RC2 evidence governance and Cases 004-012 gate
        run: node --test tests/rc2-evidence-governance.test.js tests/rc2-stress-and-learning.test.js tests/rc2-cases-004-012-gate.test.js

  full-regression:
    needs: cases-004-012-gate
    if: ${{ needs.cases-004-012-gate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test --if-present
      - run: npm run test:municipal-contracts
      - run: npm run test:municipal-live
      - run: npm run test:municipal-operational-lifecycle
      - run: npm run test:municipal-retrospective-shadow
