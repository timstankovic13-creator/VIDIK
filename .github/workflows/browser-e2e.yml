name: VIDIK 9.3 Browser Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main, v9.1.3-modular, 'prep/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical 9.3 source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run VIDIK 9.3 browser acceptance
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidik-9.3-browser-acceptance-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
