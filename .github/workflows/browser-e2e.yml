name: VIDIK 9.1.3 Browser Acceptance
on:
  push:
    branches: [v9.1.3-modular]
  pull_request:
    branches: [v9.1.3-modular]
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidik-9.1.3-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
