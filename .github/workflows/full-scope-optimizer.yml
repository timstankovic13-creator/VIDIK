name: full-scope-optimizer
on:
  pull_request:
    paths:
      - 'src/full-scope/optimizer.js'
      - 'tests/full-scope-optimizer.test.js'
      - '.github/workflows/full-scope-optimizer.yml'
jobs:
  optimizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/full-scope-optimizer.test.js
