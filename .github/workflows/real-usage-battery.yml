name: VIDIK Real Usage Battery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 20

jobs:
  real-usage-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Broad arbitrary-problem usage battery
        run: node --test tests/decision-discovery-usage-battery-v2.test.js
