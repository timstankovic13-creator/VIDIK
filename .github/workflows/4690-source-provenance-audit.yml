name: 4,690 Source Provenance Audit
on:
  push:
    branches:
      - feat/live-municipal-adapters-wup-expansion
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify fail-closed provenance contract
        shell: bash
        run: |
          set -euo pipefail
          test -f data/reference/4690-source-provenance.md
          grep -q 'UNPROVEN / FAIL-CLOSED' data/reference/4690-source-provenance.md
          test ! -f data/reference/wup-sub50k-canonical.json
          echo '4,690 provenance: UNPROVEN / FAIL-CLOSED'
          echo 'No canonical manifest will be accepted until an authoritative source and deterministic selection rule are proven.'
      - name: Run municipal adapter contract tests
        run: npm run test:municipal-contracts