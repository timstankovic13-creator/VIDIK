name: 4,690 Source Provenance Audit
on:
  push:
    branches:
      - feat/live-municipal-adapters-wup-expansion
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify fail-closed provenance contract
        shell: bash
        run: |
          set -euo pipefail
          test -f data/reference/4690-source-provenance.md
          grep -q 'SOURCE IDENTIFIED / INGESTION FAIL-CLOSED' data/reference/4690-source-provenance.md
          grep -q 'population is not' data/reference/4690-source-provenance.md
          test ! -f data/reference/wup-sub50k-canonical.json
          echo '4,690 source identity: PROVEN / population enrichment: PENDING / ingestion: FAIL-CLOSED'
          echo 'No canonical population manifest will be accepted until independent population enrichment and geographic/municipal reconciliation pass.'
      - name: Run municipal adapter contract tests
        run: npm run test:municipal-contracts
