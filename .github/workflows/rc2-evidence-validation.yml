name: VIDIK RC2 Evidence Validation
on:
  push:
    branches: [main, rc2-evidence-outcome-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: RC2 evidence governance, causal chain and fail-closed gates
        run: node --test tests/rc2-evidence-governance.test.js
  full-regression:
    needs: evidence-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Existing full acceptance and hostile lifecycle regression
        run: npx playwright test --reporter=line
