name: VIDIK Machinery Gauntlet
on:
  push:
    branches: [main]
jobs:
  machinery-gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run full machinery gauntlet
        run: node --test tests/machinery-gauntlet.test.js tests/machinery-deep-adversarial.test.js tests/machinery-pipeline-integrity.test.js tests/machinery-learning-ledger.test.js
