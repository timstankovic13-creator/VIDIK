name: VIDIK Machinery Gauntlet

on:
  pull_request:
  push:
    branches: [main]

jobs:
  machinery-gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run machinery gauntlet
        run: node --test tests/machinery-gauntlet.test.js
