name: WUP Sub-50k Source Ingestion
on:
  workflow_dispatch:
  push:
    branches: ['feat/live-municipal-adapters-wup-expansion']
permissions:
  contents: read
jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install workbook parser
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - name: Download authoritative WUP 2025 F21 city workbook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wup/output
          curl --fail --location --retry 8 --retry-all-errors --connect-timeout 30 --max-time 900 \
            -A 'VIDIK/9.3 WUP sub50k reconciliation' \
            -o /tmp/wup/WUP2025-F21-DEGURBA-Cities_Pop.xlsx \
            'https://population.un.org/wup/assets/Download/Cities/WUP2025-F21-DEGURBA-Cities_Pop.xlsx'
          test -s /tmp/wup/WUP2025-F21-DEGURBA-Cities_Pop.xlsx
          sha256sum /tmp/wup/WUP2025-F21-DEGURBA-Cities_Pop.xlsx | tee /tmp/wup/output/wup-f21.sha256

      - name: Derive canonical WUP urban-centre sub-50k universe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,math,os,re
          from openpyxl import load_workbook

          p='/tmp/wup/WUP2025-F21-DEGURBA-Cities_Pop.xlsx'
          wb=load_workbook(p,read_only=True,data_only=True)
          if 'Data' not in wb.sheetnames:
              raise SystemExit(f'Expected Data sheet, got {wb.sheetnames}')
          ws=wb['Data']

          def clean(v):
              return '' if v is None else str(v).strip()
          def norm(v):
              return re.sub(r'[^a-z0-9]+','_',clean(v).lower()).strip('_')

          header=None
          for ri,row in enumerate(ws.iter_rows(values_only=True)):
              if ri >= 500: break
              loc=city=pop=None
              for ci,v in enumerate(row):
                  k=norm(v)
                  if k in ('location','location_name'): loc=ci
                  elif k in ('city_name','city','cities'): city=ci
                  elif k=='2025' or k.startswith('2025_'): pop=ci
              if loc is not None and city is not None and pop is not None:
                  header=(ri,loc,city,pop); break
              if ri >= 499: break
          if header is None:
              raise SystemExit('Could not identify WUP F21 Data fields Location, City_Name, 2025')

          hi,loc_i,city_i,pop_i=header
          records=[]
          skipped=0
          for row_number,row in enumerate(ws.iter_rows(values_only=True),start=1):
              if row_number <= hi+1: continue
              if max(loc_i,city_i,pop_i) >= len(row):
                  skipped += 1
                  continue
              country,city,raw=clean(row[loc_i]),clean(row[city_i]),row[pop_i]
              if not country or not city:
                  skipped += 1
                  continue
              try:
                  value=float(str(raw).replace(',','').strip())
              except (TypeError,ValueError):
                  skipped += 1
                  continue
              # WUP F21 population is in thousands: 50 means 50,000.
              if math.isfinite(value) and value > 0 and value < 50:
                  records.append({'country':country,'name':city,'population_thousands':value})

          if not records:
              raise SystemExit('wup-f21-produced-no-sub50k-records')

          # Deterministically collapse only exact repeats; preserve legitimate
          # same-name records where the population differs.
          seen=set(); out=[]; duplicate_exact=0
          for r in records:
              key=(norm(r['country']),norm(r['name']),r['population_thousands'])
              if key in seen:
                  duplicate_exact += 1
                  continue
              seen.add(key); out.append(r)
          out.sort(key=lambda r:(norm(r['country']),norm(r['name']),r['population_thousands']))

          expected=4690
          print('2025 WUP sub-50k canonical urban-centre records:',len(out))
          print('Expected VIDIK expansion universe:',expected)
          if len(out) != expected:
              raise SystemExit(f'sub50k-wup-f21-count-mismatch:{len(out)}:expected:{expected}')

          report={
            'dataset':'WUP2025-F21-DEGURBA-Cities_Pop',
            'sheet':'Data',
            'population_field':'2025',
            'population_units':'thousands',
            'coverage_rule':'WUP urban centres with population < 50,000',
            'record_count':len(out),
            'expected_records':expected,
            'duplicate_exact_rows_collapsed':duplicate_exact,
            'skipped_rows':skipped,
            'source_sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),
            'source_bytes':os.path.getsize(p),
            'status':'validated-canonical-sub50k-universe'
          }
          json.dump(report,open('/tmp/wup/output/sub50k-reconciliation-report.json','w'),indent=2)
          json.dump(out,open('/tmp/wup/output/sub50k-canonical.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(report,indent=2))
          PY

      - name: Upload validated sub-50k universe
        uses: actions/upload-artifact@v4
        with:
          name: vidik-wup-sub50k-canonical-universe
          path: /tmp/wup/output/
          retention-days: 30
