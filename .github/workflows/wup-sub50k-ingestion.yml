name: WUP Sub-50k Source Ingestion
on:
  workflow_dispatch:
  push:
    branches: ['feat/live-municipal-adapters-wup-expansion']
permissions:
  contents: read
jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download authoritative GHSL WUP-MTUC R2025A statistics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wup/raw /tmp/wup/output
          url='https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_WUP_MTUC_GLOBE_R2025A/V1-1/GHS_WUP_MTUC_GLOBE_R2025A_V1_1_statistics.zip'
          curl --fail --location --retry 8 --retry-all-errors --connect-timeout 30 --max-time 900 -A 'VIDIK-WUP-ingestion/1.0' -o /tmp/wup/raw/mtuc.zip "$url"
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          p=Path('/tmp/wup/raw/mtuc.zip')
          if not zipfile.is_zipfile(p): raise SystemExit('wup-mtuc-download-not-zip')
          if p.stat().st_size < 1000000: raise SystemExit(f'wup-mtuc-download-too-small:{p.stat().st_size}')
          d=hashlib.sha256(p.read_bytes()).hexdigest()
          print('Selected source:', 'https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_WUP_MTUC_GLOBE_R2025A/V1-1/GHS_WUP_MTUC_GLOBE_R2025A_V1_1_statistics.zip')
          print('Source SHA-256:',d)
          Path('/tmp/wup/output/source.url').write_text('https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_WUP_MTUC_GLOBE_R2025A/V1-1/GHS_WUP_MTUC_GLOBE_R2025A_V1_1_statistics.zip\n')
          Path('/tmp/wup/output/source.sha256').write_text(d+'\n')
          PY
          unzip -q /tmp/wup/raw/mtuc.zip -d /tmp/wup/raw/unpacked
          find /tmp/wup/raw/unpacked -type f -maxdepth 8 -print

      - name: Derive canonical WUP urban-centre sub-50k universe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,hashlib,json,math,os,re
          from pathlib import Path
          root=Path('/tmp/wup/raw/unpacked')
          files=sorted([p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.csv','.txt'}])
          if not files: raise SystemExit('wup-mtuc-statistics-csv-not-found')
          def norm(v): return re.sub(r'[^a-z0-9]+','_',str(v or '').strip().lower()).strip('_')
          def read_header(p):
              with p.open('r',encoding='utf-8-sig',errors='replace',newline='') as f:
                  for row in csv.reader(f):
                      if any(str(x).strip() for x in row): return row
              return []
          chosen=None; schema=None
          for p in files:
              h=read_header(p); keys={norm(x) for x in h}
              pop=next((x for x in h if norm(x) in {'pop_2025','population_2025','population','pop'}),None)
              name=next((x for x in h if norm(x) in {'name','uc_name','city_name','city','unlocname','unloc_name'}),None)
              country=next((x for x in h if norm(x) in {'country','country_name','cntr_code','country_code'}),None)
              if pop and name and country:
                  chosen=p; schema=(h,pop,name,country); break
          if chosen is None: raise SystemExit('wup-mtuc-schema-not-found')
          h,pop_col,name_col,country_col=schema
          idx={k:i for i,k in enumerate(h)}
          records=[]; skipped=0
          with chosen.open('r',encoding='utf-8-sig',errors='replace',newline='') as f:
              for row in csv.DictReader(f):
                  try: pop=float(str(row.get(pop_col,'')).replace(',','').strip())
                  except (TypeError,ValueError): skipped+=1; continue
                  if not math.isfinite(pop) or pop<=0 or pop>=50000: continue
                  country=str(row.get(country_col,'')).strip(); name=str(row.get(name_col,'')).strip()
                  if not country or not name: skipped+=1; continue
                  records.append({'country':country,'name':name,'population_2025':pop})
          seen=set(); out=[]; dup=0
          for r in records:
              key=(norm(r['country']),norm(r['name']),r['population_2025'])
              if key in seen: dup+=1; continue
              seen.add(key); out.append(r)
          out.sort(key=lambda r:(norm(r['country']),norm(r['name']),r['population_2025']))
          print('Statistics file:',chosen)
          print('2025 WUP-MTUC sub-50k candidates:',len(out))
          print('Expected VIDIK expansion universe:',4690)
          if len(out)!=4690: raise SystemExit(f'sub50k-wup-mtuc-count-mismatch:{len(out)}:expected:4690')
          report={'dataset':'GHS_WUP_MTUC_GLOBE_R2025A_V1_1_statistics','source_file':str(chosen.relative_to(root)),'population_field':pop_col,'coverage_rule':'WUP urban centres with 2025 population < 50,000','record_count':len(out),'expected_records':4690,'duplicate_exact_rows_collapsed':dup,'skipped_rows':skipped,'source_zip_sha256':hashlib.sha256(open('/tmp/wup/raw/mtuc.zip','rb').read()).hexdigest(),'status':'validated-canonical-sub50k-universe'}
          json.dump(report,open('/tmp/wup/output/sub50k-reconciliation-report.json','w'),indent=2)
          json.dump(out,open('/tmp/wup/output/sub50k-canonical.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(report,indent=2))
          PY

      - name: Upload validated sub-50k universe
        uses: actions/upload-artifact@v4
        with:
          name: vidik-wup-sub50k-canonical-universe
          path: /tmp/wup/output/
          retention-days: 30
