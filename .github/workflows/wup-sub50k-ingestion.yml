name: WUP Sub-50k Expansion Contract Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical expansion source exists
        shell: bash
        run: |
          set -euo pipefail
          source='data/reference/wup-sub50k-canonical.json'
          if [[ ! -f "$source" ]]; then
            echo 'wup-expansion-source-required'
            echo "Expected canonical source: $source"
            echo 'The 4690-record expansion contract is not derivable from WUP-MTUC: WUP 2025 covers urban settlements with 50,000+ inhabitants.'
            echo 'WUP may be used for reconciliation/enrichment after the canonical expansion source is established.'
            exit 1
          fi
          python3 - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          p=Path('data/reference/wup-sub50k-canonical.json')
          raw=p.read_bytes()
          records=json.loads(raw.decode('utf-8'))
          if not isinstance(records,list): raise SystemExit('wup-expansion-source-not-array')
          if len(records)!=4690: raise SystemExit(f'wup-expansion-record-count:{len(records)}:expected:4690')
          required=('city','country','population')
          seen=set()
          for i,row in enumerate(records,1):
              if not isinstance(row,dict): raise SystemExit(f'wup-expansion-invalid-record:{i}')
              missing=[k for k in required if row.get(k) in (None,'')]
              if missing: raise SystemExit(f'wup-expansion-missing:{i}:{missing}')
              try: pop=float(row['population'])
              except Exception: raise SystemExit(f'wup-expansion-invalid-population:{i}')
              if not (0 < pop < 50000): raise SystemExit(f'wup-expansion-population-out-of-range:{i}:{pop}')
              key=(str(row['country']).strip().casefold(),str(row['city']).strip().casefold())
              if key in seen: raise SystemExit(f'wup-expansion-duplicate:{key}')
              seen.add(key)
          sha=hashlib.sha256(raw).hexdigest()
          print('Canonical expansion source:',p)
          print('Canonical expansion records:',len(records))
          print('Canonical expansion SHA-256:',sha)
          print('WUP role: reconciliation/enrichment only')
          PY

      - name: Upload validated canonical expansion
        uses: actions/upload-artifact@v4
        with:
          name: vidik-wup-sub50k-canonical-universe
          path: data/reference/wup-sub50k-canonical.json
          retention-days: 30
