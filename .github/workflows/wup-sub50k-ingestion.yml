name: WUP Sub-50k Source Ingestion
on:
  workflow_dispatch:
  push:
    branches: ['feat/live-municipal-adapters-wup-expansion']
permissions:
  contents: read
jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install geospatial dependencies
        run: python3 -m pip install --disable-pip-version-check geopandas pyogrio
      - name: Download authoritative GHS-WUP-DEGURBA 2025 vector from JRC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wup/raw /tmp/wup/output
          python3 - <<'PY'
          import hashlib, time, urllib.request, zipfile
          from pathlib import Path

          url=('https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/'
               'GHS_WUP_DEGURBA_GLOBE_R2025A/'
               'GHS_WUP_DEGURBA_E2025_GLOBE_R2025A_54009_1000/V1-0/'
               'GHS_WUP_DEGURBA_E2025_GLOBE_R2025A_54009_1000_V1_0.zip')
          out=Path('/tmp/wup/raw/source.zip')
          last=None
          for attempt in range(1,6):
              try:
                  print(f'Downloading authoritative JRC source (attempt {attempt}/5)')
                  req=urllib.request.Request(url,headers={'User-Agent':'VIDIK-WUP-ingestion/1.0'})
                  with urllib.request.urlopen(req,timeout=300) as r, out.open('wb') as f:
                      while True:
                          chunk=r.read(1024*1024)
                          if not chunk: break
                          f.write(chunk)
                  if not zipfile.is_zipfile(out):
                      raise RuntimeError('downloaded artifact is not a valid ZIP')
                  if out.stat().st_size < 100000:
                      raise RuntimeError(f'downloaded artifact unexpectedly small: {out.stat().st_size}')
                  break
              except Exception as e:
                  last=e
                  print('download failed:',repr(e))
                  if attempt < 5: time.sleep(2**attempt)
          else:
              raise SystemExit(f'jrc-wup-download-failed:{last}')
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          print('Selected source:',url)
          print('Source SHA-256:',digest)
          Path('/tmp/wup/output/source.url').write_text(url+'\n')
          Path('/tmp/wup/output/source.sha256').write_text(digest+'\n')
          PY
          test -s /tmp/wup/raw/source.zip
          mkdir -p /tmp/wup/raw/unpacked
          unzip -q /tmp/wup/raw/source.zip -d /tmp/wup/raw/unpacked
          find /tmp/wup/raw/unpacked -maxdepth 8 -type f -print
      - name: Discover 2025 settlement entities below 50k
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import geopandas as gpd, json, hashlib, re
          root=Path('/tmp/wup/raw/unpacked')
          shp=next(iter(sorted(root.rglob('*.shp'))),None)
          if shp is None: raise SystemExit('wup-degurba-vector-not-found')
          gdf=gpd.read_file(shp)
          print('Columns:',list(gdf.columns)); print('Rows:',len(gdf))
          cols={re.sub(r'[^a-z0-9]+','_',str(c).lower()).strip('_'):c for c in gdf.columns}
          pop=next((cols[k] for k in cols if k in ('population','pop','pop_2025','population_2025')),None)
          typ=next((cols[k] for k in cols if k in ('class','class_code','degurba','degurba_class','type')),None)
          country=next((cols[k] for k in cols if k in ('country','country_name','cntr_code')),None)
          name=next((cols[k] for k in cols if k in ('name','uc_name','city','city_name','unlocname','unloc_name')),None)
          if pop is None: raise SystemExit('wup-degurba-population-column-not-found')
          sub=gdf[gdf[pop].notna() & (gdf[pop].astype(float)>0) & (gdf[pop].astype(float)<50000)].copy()
          print('2025 sub-50k settlement candidates:',len(sub)); print('Target previously assumed by VIDIK:',4690)
          if typ is not None: print(sub[typ].value_counts(dropna=False).to_string())
          out=[{'name':str(r[name]) if name is not None else '','country':str(r[country]) if country is not None else '','population':float(r[pop]),'entity_type':str(r[typ]) if typ is not None else ''} for _,r in sub.iterrows()]
          out.sort(key=lambda x:(x['country'].lower(),x['name'].lower(),x['population']))
          raw=json.dumps(out,ensure_ascii=False,indent=2)+'\n'
          Path('/tmp/wup/output/candidates.json').write_text(raw,encoding='utf-8')
          Path('/tmp/wup/output/candidates.sha256').write_text(hashlib.sha256(raw.encode()).hexdigest()+'\n')
          if not out: raise SystemExit('wup-degurba-no-sub50k-settlements')
          PY
      - name: Upload validated source discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidik-wup-sub50k-source-discovery
          path: /tmp/wup/output/
          retention-days: 30
