name: VIDIK Product Usage Gamut

on:
  push:
    branches: [main]
    paths:
      - 'tests/product-usage-gamut.test.js'
      - 'js/**'
      - 'scripts/municipal-production-decision-run.js'
      - 'package.json'
      - '.github/workflows/product-usage-gamut.yml'

permissions:
  contents: read

jobs:
  product-usage-gamut:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - name: Run product usage gamut
        run: npm run test:product-usage-gamut
