name: VIDIK RC2 Evidence Acquisition and Learning
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rc2-acquisition-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: RC2 acquisition and learning tests
        run: node --test tests/rc2-evidence-acquisition.test.js tests/rc2-evidence-governance.test.js tests/rc2-stress-and-learning.test.js tests/rc2-cases-004-012-gate.test.js
  full-regression:
    needs: rc2-acquisition-learning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Full Playwright acceptance and hostile lifecycle regression
        run: npx playwright test --reporter=line
