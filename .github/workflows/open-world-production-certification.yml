name: VIDIK Open-World Production Certification

on:
  push:
    branches: [main]

jobs:
  open-world-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Open-world production closed loop
        run: node tests/open-world-production-closed-loop.test.js
