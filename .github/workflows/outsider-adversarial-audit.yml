name: VIDIK Outsider Adversarial Audit

on:
  push:
    branches: [outsider-adversarial-audit-v1]
  pull_request:
    branches: [main]

jobs:
  outsider-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node --test tests/outsider-adversarial-audit.test.js
