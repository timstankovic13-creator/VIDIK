name: VIDIK 9.6.1 Full Regression
on:
  workflow_dispatch:
  push:
    branches: [main, 'prep/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json || test -f npm-shrinkwrap.json; then npm ci; else npm install --ignore-scripts; fi
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full Playwright acceptance and hostile lifecycle suites
        run: |
          set -euo pipefail
          npx playwright test --reporter=line
