name: VIDIK 9.6.1 Full Regression
on:
  workflow_dispatch:
  push:
    branches: [main, 'prep/**', 'ci/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json || test -f npm-shrinkwrap.json; then npm ci; else npm install --ignore-scripts; fi
      - name: Deterministic production release gate
        shell: bash
        run: |
          set -euo pipefail
          npm run test:production-release-gate
          npm run test:production-config
          npm run test:municipal-contracts
          npm run test:municipal-ingestion
          npm run test:municipal-live
          npm run test:municipal-production
          npm run test:municipal-operational-lifecycle
          npm run test:municipal-retrospective-shadow
          npm run test:municipal-evidence-pipeline
          npm run test:outcome-learning
          npm run test:hostile-readiness
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full Playwright acceptance and hostile lifecycle suites
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --reporter=line
