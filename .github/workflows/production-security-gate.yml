name: VIDIK Production Security Gate
on:
  pull_request:
  push:
    branches: ['main', 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
      - name: High-severity dependency audit
        shell: bash
        run: npm audit --audit-level=high
      - name: Secret material scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git --exclude='*.lock' --exclude='*.map' '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-)' .
      - name: Production security contract
        shell: bash
        run: |
          set -euo pipefail
          test -f SECURITY.md
          grep -q 'managed persistence' SECURITY.md
          grep -q 'least-privilege' SECURITY.md
          grep -q 'TLS' SECURITY.md
          grep -q 'Backups' SECURITY.md
          grep -q 'Recovery' SECURITY.md
          grep -q 'Audit integrity' SECURITY.md
  lifecycle-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Install Playwright Chromium
        shell: bash
        run: npx playwright install chromium
      - name: Run outcome-learning lifecycle acceptance
        shell: bash
        run: npx playwright test tests/e2e/municipal-lifecycle-10.spec.js
