name: VIDIK Production Real Decision Gamut

on:
  push:
    branches: ['ci/production-real-decision']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-real-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --ignore-scripts
      - name: Live municipal decision and learning lifecycle
        run: npm run test:production-real-decision
      - name: Full deterministic production gate
        run: |
          npm run test:production-release-gate
          npm run test:production-config
          npm run test:municipal-contracts
          npm run test:municipal-ingestion
          npm run test:municipal-live
          npm run test:municipal-production
          npm run test:municipal-operational-lifecycle
          npm run test:municipal-retrospective-shadow
          npm run test:municipal-evidence-pipeline
          npm run test:outcome-learning
          npm run test:hostile-readiness
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full browser acceptance and hostile lifecycle suites
        run: npx playwright test --reporter=line
