name: VIDIK Nine-Gap Hardening

on:
  pull_request:
    branches: [main]
  push:
    branches: [hardening/vidik-nine-gaps]

jobs:
  nine-gaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run nine-gaps-hardening
      - run: npm run test:resource-optimization
      - run: npm run test:discovery-transfer-intelligence
      - run: npm run test:vidik-next-eight
