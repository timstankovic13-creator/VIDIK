name: VIDIK Municipal Intervention Universe
on:
  pull_request:
    paths:
      - 'js/intervention-universe.js'
      - 'js/municipal-universe-governance.js'
      - 'js/municipal-universe-ui.js'
      - 'js/municipal-universe-evidence.js'
      - 'tests/municipal-intervention-universe.test.js'
      - 'package.json'
  push:
    branches: [main, 'feat/production-core-steps-5-6']
    paths:
      - 'js/intervention-universe.js'
      - 'js/municipal-universe-governance.js'
      - 'js/municipal-universe-ui.js'
      - 'js/municipal-universe-evidence.js'
      - 'tests/municipal-intervention-universe.test.js'
      - 'package.json'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:intervention-universe
