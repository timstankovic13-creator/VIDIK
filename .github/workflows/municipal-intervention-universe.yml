name: VIDIK Municipal Intervention Universe
on:
  pull_request:
    paths: ['js/intervention-universe.js','js/municipal-universe-governance.js','js/municipal-universe-ui.js','js/municipal-universe-evidence.js','js/municipal-budget-optimizer-10.js','js/vidik-decision-integrity-11.js','tests/municipal-intervention-universe.test.js','tests/municipal-budget-optimizer-10.test.js','tests/municipal-universe-governance.test.js','tests/vidik-decision-integrity-11.test.js','package.json','js/config.js']
  push:
    branches: [main, 'feat/production-core-steps-5-6']
    paths: ['js/intervention-universe.js','js/municipal-universe-governance.js','js/municipal-universe-ui.js','js/municipal-universe-evidence.js','js/municipal-budget-optimizer-10.js','js/vidik-decision-integrity-11.js','tests/municipal-intervention-universe.test.js','tests/municipal-budget-optimizer-10.test.js','tests/municipal-universe-governance.test.js','tests/vidik-decision-integrity-11.test.js','package.json','js/config.js']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm run test:intervention-universe
      - run: npm run test:municipal-budget-optimizer
      - run: npm run test:municipal-universe-governance
      - run: npm run test:decision-integrity-11
