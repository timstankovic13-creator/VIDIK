name: VIDIK Cases 001-014 Blind Temporal Batch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blind-and-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install chromium
      - name: Run complete frozen 001-014 blind batch
        run: npx playwright test tests/e2e/cases001-014-blind-batch.spec.js --project=chromium --reporter=line
      - name: Run frozen decision lifecycle validation
        run: npx playwright test tests/e2e/frozen-lifecycle-rc1.spec.js --project=chromium --reporter=line
