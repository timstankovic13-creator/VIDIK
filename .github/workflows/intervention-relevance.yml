name: VIDIK Intervention Relevance Validation

# Explicit engine validation. Canonical PR coverage lives in Intelligence Completion v1.
on:
  push:
    branches: [main]
    paths:
      - 'js/source-driven-intervention-discovery.js'
      - 'tests/intervention-relevance-scenarios.test.js'
      - 'tests/intervention-relevance-novel-problems.test.js'
      - '.github/workflows/intervention-relevance.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  relevance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run established relevance scenarios
        run: node --test tests/intervention-relevance-scenarios.test.js
      - name: Run novel-problem relevance scenarios
        run: node --test tests/intervention-relevance-novel-problems.test.js
