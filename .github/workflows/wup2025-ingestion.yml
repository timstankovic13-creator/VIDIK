name: WUP 2025 Official City Ingestion
on:
  workflow_dispatch:
  push:
    branches: ['prep/**']
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official WUP 2025 CSV catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wup/raw /tmp/wup/output
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          from pathlib import Path
          import hashlib, json
          base='https://population.un.org/wup/'
          page='https://population.un.org/wup/downloads?tab=Cities'
          req=Request(page, headers={'User-Agent':'VIDIK-WUP-2025-ingestion/1.0'})
          html=urlopen(req, timeout=60).read()
          Path('/tmp/wup/output/download-page.html').write_bytes(html)
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag=='a':
                      d=dict(attrs); href=d.get('href'); text=d.get('download','') or d.get('title','')
                      if href: self.links.append((href,text))
          p=P(); p.feed(html.decode('utf-8','replace'))
          links=[]
          for href,text in p.links:
              u=urljoin(page,href)
              if 'population.un.org' in u and ('WUP2025' in u or 'wup2025' in u) and any(x in u.lower() for x in ('.csv','.zip','.xlsx','.xls')):
                  links.append(u)
          links=sorted(set(links))
          if not links: raise SystemExit('no-official-wup-2025-download-links-found')
          Path('/tmp/wup/output/catalog.json').write_text(json.dumps({'source_page':page,'links':links},indent=2)+'\n')
          print('official WUP links discovered:',len(links))
          for u in links: print(u)
          PY
          python3 - <<'PY'
          import json,urllib.request,hashlib,os
          from pathlib import Path
          cat=json.load(open('/tmp/wup/output/catalog.json'))
          out=Path('/tmp/wup/raw')
          for i,u in enumerate(cat['links']):
              name=os.path.basename(u.split('?',1)[0]) or f'wup-{i}'
              p=out/name
              urllib.request.urlretrieve(u,p)
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              print(f'{name} sha256={h} bytes={p.stat().st_size}')
          PY
      - name: Build immutable WUP source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,glob,os
          files=[]
          for p in sorted(glob.glob('/tmp/wup/raw/*')):
              if os.path.isfile(p):
                  h=hashlib.sha256(open(p,'rb').read()).hexdigest()
                  files.append({'file':os.path.basename(p),'sha256':h,'bytes':os.path.getsize(p)})
          assert files, 'no-wup-source-files'
          json.dump({'schema_version':'1.0.0','publisher':'United Nations DESA Population Division','dataset':'World Urbanization Prospects 2025','source_page':'https://population.un.org/wup/downloads?tab=Cities','files':files},open('/tmp/wup/output/source-manifest.json','w'),indent=2)
          PY
      - name: Upload WUP source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidik-wup-2025-official-source
          path: /tmp/wup/output/
          retention-days: 30
