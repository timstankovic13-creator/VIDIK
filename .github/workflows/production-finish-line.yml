name: VIDIK Production Finish Line

# This is an explicit certification workflow, not a per-commit fan-out.
# Run it deliberately after the targeted validation is green.
on:
  workflow_dispatch:

concurrency:
  group: vidik-production-finish-line
  cancel-in-progress: true

jobs:
  production-finish-line:
    name: Production finish-line certification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Core intelligence and governance
        run: |
          npm run test:decision-intelligence
          npm run test:arbitrary-decision-governance
          npm run test:arbitrary-decision-execution
          npm run test:vidik-next-eight
          npm run test:unseen-problem-discovery
      - name: Discovery and evidence
        run: |
          npm run test:intervention-discovery
          npm run test:source-driven-discovery
          npm run test:source-driven-evidence
          npm run test:evidence-acquisition-orchestrator
          npm run test:independent-evidence-verification
      - name: Production integrity
        run: |
          npm run test:production-hardening-a-d
          npm run test:hostile-readiness
          npm run test:production-release-gate
          npm run test:municipal-production
          npm run test:municipal-decision-integrity
          npm run test:outcome-learning
      - name: Browser production acceptance
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Production finish-line generalization
        run: npm run test:production-finish-line
