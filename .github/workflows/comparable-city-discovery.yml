name: VIDIK Comparable-City Discovery Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/discovery-transfer-intelligence.js'
      - 'tests/discovery-transfer-intelligence.test.js'
      - 'js/decision-discovery-execution.js'
      - 'js/decision-discovery-orchestrator.js'
  push:
    branches: [main]
    paths:
      - 'js/discovery-transfer-intelligence.js'
      - 'tests/discovery-transfer-intelligence.test.js'

permissions:
  contents: read

jobs:
  comparable-city-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Comparable-city discovery contract
        run: npm run test:discovery-transfer-intelligence
      - name: Discovery execution regression
        run: npm run test:decision-discovery-execution
      - name: Discovery orchestration regression
        run: npm run test:decision-discovery-orchestration
