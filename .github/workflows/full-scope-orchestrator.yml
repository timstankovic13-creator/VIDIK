name: full-scope-orchestrator
on:
  push:
    branches: [main]
    paths:
      - 'src/full-scope/**'
      - 'tests/full-scope-orchestrator.test.js'
      - '.github/workflows/full-scope-orchestrator.yml'
jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node tests/full-scope-orchestrator.test.js
