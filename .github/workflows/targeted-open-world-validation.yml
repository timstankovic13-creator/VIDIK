name: VIDIK Targeted Open-World Validation

on:
  pull_request:
    paths:
      - 'js/source-driven-intervention-discovery.js'
      - 'tests/open-world-discovery-expansion.test.js'
      - '.github/workflows/targeted-open-world-validation.yml'

permissions:
  contents: read

jobs:
  open-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - name: Targeted open-world discovery validation
        run: node --test tests/open-world-discovery-expansion.test.js
