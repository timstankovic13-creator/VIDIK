name: VIDIK Discovery Stage Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_VERSION: 24
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Run 60-case stage diagnostic
        run: node --test tests/discovery-stage-diagnostic.test.js
