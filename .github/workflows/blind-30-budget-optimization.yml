name: Blind 30 Budget Optimization Campaign

on:
  push:
    branches: [ blind-30-budget-optimization-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  blind-30-budget-optimization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run 30 blind budget optimization tests
        run: node --test tests/blind-30-budget-optimization.test.js
      - name: Run quantitative bridge regression
        run: node tests/decision-quantification-bridge.test.js
      - name: Run resource optimization regression
        run: node tests/vidik-resource-optimization.test.js
