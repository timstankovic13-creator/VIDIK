name: WUP 2025 City Universe Audit
on:
  workflow_dispatch:
  push:
    branches: ['prep/**']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover authoritative WUP city resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wup
          curl --fail --location --retry 4 -A 'VIDIK/9.3 data-audit' -o /tmp/wup/cities.html 'https://population.un.org/wup/downloads?tab=Cities'
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          import json,re
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]; self.current=None
              def handle_starttag(self,t,a):
                  if t=='a':
                      d=dict(a); self.current={'href':d.get('href',''),'text':''}
              def handle_data(self,d):
                  if self.current is not None: self.current['text'] += d
              def handle_endtag(self,t):
                  if t=='a' and self.current is not None:
                      self.links.append(self.current); self.current=None
          p=P(); p.feed(open('/tmp/wup/cities.html',encoding='utf-8').read())
          base='https://population.un.org/wup/downloads?tab=Cities'
          candidates=[]
          for item in p.links:
              h=item.get('href','').strip(); text=' '.join(item.get('text','').split())
              combined=(h+' '+text).lower()
              if 'wup2025' not in combined: continue
              if not any(x in combined for x in ('.csv','.zip','.xlsx','.xls','f18','f19','f20','f21','f22','f23','f24','f25','f26','f27','f28','f29','f30','f31','f32','f33','f34')): continue
              if not h or h.startswith(('javascript:','#')): continue
              candidates.append({'url':urljoin(base,h),'label':text})
          # Preserve every official WUP2025 resource exposed by the page; row-level validation below decides whether it is suitable.
          uniq={x['url']:x for x in candidates}
          candidates=sorted(uniq.values(),key=lambda x:x['url'])
          json.dump({'source_page':base,'candidates':candidates},open('/tmp/wup/resources.json','w'),indent=2)
          print(json.dumps(candidates,indent=2))
          if not candidates:
              raise SystemExit('No WUP2025 download links exposed in the official Cities page HTML; page delivery appears dynamic and must be inspected rather than silently substituting another dataset')
          PY
      - name: Download candidate city resources and identify row-level city data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          from urllib.parse import urlparse
          r=json.load(open('/tmp/wup/resources.json'))
          for i,item in enumerate(r['candidates']):
              u=item['url']; name=os.path.basename(urlparse(u).path) or f'resource-{i}'
              name=name.replace(' ','_')
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'VIDIK/9.3 data-audit'})
                  with urllib.request.urlopen(req,timeout=90) as x, open('/tmp/wup/'+name,'wb') as f: f.write(x.read())
                  print('downloaded',u,'->',name)
              except Exception as e:
                  print('download-failed',u,repr(e))
          PY
      - name: Validate and derive city universe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,glob,hashlib,json,os,sys,zipfile
          csv.field_size_limit(sys.maxsize)
          files=glob.glob('/tmp/wup/*')
          print('resources:',[os.path.basename(x) for x in files])
          row_level=[]
          for p in files:
              if not os.path.isfile(p): continue
              if p.endswith('.zip'):
                  try:
                      with zipfile.ZipFile(p) as z:
                          names=z.namelist(); print('zip',os.path.basename(p),names[:50])
                          for n in names:
                              if n.lower().endswith('.csv') and ('city' in n.lower() or 'cities' in n.lower()):
                                  row_level.append((p,n))
                  except zipfile.BadZipFile: pass
              elif p.lower().endswith('.csv'):
                  with open(p,encoding='utf-8-sig',newline='') as f:
                      h=next(csv.reader(f),[])
                  hs={x.strip().lower() for x in h}
                  if {'city_code','city_name'}.issubset(hs) or {'city_code','city_name_en'}.issubset(hs): row_level.append((p,None))
          if not row_level:
              raise SystemExit('No row-level WUP city resource with City_Code/City_Name discovered; aggregate tables must not be treated as the city census')
          print('row-level city resources:',row_level)
          PY
      - name: Hash source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,glob,os
          out=[]
          for p in sorted(glob.glob('/tmp/wup/*')):
              if os.path.isfile(p):
                  h=hashlib.sha256(open(p,'rb').read()).hexdigest()
                  out.append({'file':os.path.basename(p),'sha256':h,'bytes':os.path.getsize(p)})
          json.dump(out,open('/tmp/wup/source-manifest.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vidik-wup-city-universe-audit
          path: /tmp/wup/*
          retention-days: 30
