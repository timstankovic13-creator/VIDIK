name: WUP 2025 City Universe Audit
on:
  workflow_dispatch:
  push:
    branches: ['prep/**']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python workbook parser
        run: python3 -m pip install --disable-pip-version-check openpyxl
      - name: Discover and download authoritative WUP city population source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wup
          curl --fail --location --retry 4 -A 'VIDIK/9.3 data-audit' -o /tmp/wup/cities.html 'https://population.un.org/wup/downloads?tab=Cities'
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit, urlunsplit, quote
          import json, urllib.request
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]; self.current=None
              def handle_starttag(self,t,a):
                  if t=='a':
                      d=dict(a); self.current={'href':d.get('href',''),'text':''}
              def handle_data(self,d):
                  if self.current is not None: self.current['text'] += d
              def handle_endtag(self,t):
                  if t=='a' and self.current is not None:
                      self.links.append(self.current); self.current=None
          p=P(); p.feed(open('/tmp/wup/cities.html',encoding='utf-8').read())
          base='https://population.un.org/wup/downloads?tab=Cities'
          candidates=[]
          for item in p.links:
              h=item.get('href','').strip(); text=' '.join(item.get('text','').split())
              combined=(h+' '+text).lower()
              if 'wup2025-f21-degurba-cities_pop' in combined:
                  if h and not h.startswith(('javascript:','#')):
                      candidates.append({'url':urljoin(base,h),'label':text})
          # The official catalogue identifies F21 as the city-population table. Keep an explicit
          # canonical fallback because the UN download page can render the Cities table dynamically.
          candidates.append({'url':'https://population.un.org/wup/assets/Download/Cities/WUP2025-F21-DEGURBA-Cities_Pop.xlsx','label':'WUP2025-F21-DEGURBA-Cities_Pop'})
          uniq={x['url']:x for x in candidates}
          candidates=list(uniq.values())
          json.dump({'source_page':base,'dataset':'WUP2025-F21-DEGURBA-Cities_Pop','candidates':candidates},open('/tmp/wup/resources.json','w'),indent=2)
          downloaded=False
          for i,item in enumerate(candidates):
              parts=urlsplit(item['url'])
              encoded_path=quote(parts.path,safe='/%:@-._~!$&\'()*+,;=')
              u=urlunsplit((parts.scheme,parts.netloc,encoded_path,parts.query,parts.fragment))
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'VIDIK/9.3 data-audit'})
                  with urllib.request.urlopen(req,timeout=120) as x, open('/tmp/wup/WUP2025-F21-DEGURBA-Cities_Pop.xlsx','wb') as f: f.write(x.read())
                  print('downloaded',u)
                  downloaded=True
                  break
              except Exception as e:
                  print('download-failed',u,repr(e))
          if not downloaded:
              raise SystemExit('Unable to download official WUP2025 F21 city population workbook')
          PY
      - name: Validate workbook and derive city universe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib, os, re, math
          from openpyxl import load_workbook
          path='/tmp/wup/WUP2025-F21-DEGURBA-Cities_Pop.xlsx'
          wb=load_workbook(path,read_only=True,data_only=True)
          found=[]
          for ws in wb.worksheets:
              rows=ws.iter_rows(values_only=True)
              header=None; header_idx=None
              buffered=[]
              for idx,row in enumerate(rows,1):
                  vals=[str(x).strip() if x is not None else '' for x in row]
                  low=[v.lower() for v in vals]
                  if header is None and any('city' in v for v in low) and any(v=='2025' or '2025' in v for v in low):
                      header=vals; header_idx=idx; continue
                  if header is not None:
                      buffered.append(vals)
              if header is None: continue
              city_i=next((i for i,v in enumerate(header) if 'city' in v.lower()),None)
              country_i=next((i for i,v in enumerate(header) if 'country' in v.lower() or 'area' in v.lower()),None)
              year_i=next((i for i,v in enumerate(header) if v=='2025' or '2025' in v),None)
              if city_i is None or year_i is None: continue
              records=[]
              for row in buffered:
                  if city_i>=len(row) or year_i>=len(row): continue
                  city=row[city_i].strip()
                  if not city: continue
                  raw=row[year_i]
                  try: pop=float(str(raw).replace(',',''))
                  except Exception: continue
                  if not math.isfinite(pop): continue
                  if pop >= 50:
                      country=row[country_i].strip() if country_i is not None and country_i<len(row) else ''
                      records.append((country,city,pop))
              if records:
                  found.append({'sheet':ws.title,'header_row':header_idx,'records':records})
          if not found:
              raise SystemExit('Could not identify row-level city records and a 2025 population column in official F21 workbook')
          records=[r for block in found for r in block['records']]
          keys=[(a.lower(),b.lower()) for a,b,_ in records]
          dup=len(keys)-len(set(keys))
          names={b.lower() for _,b,_ in records}
          if 'ottawa' not in names or 'toronto' not in names:
              raise SystemExit('Required Canadian cities Ottawa/Toronto were not found in derived WUP city universe')
          report={
              'dataset':'WUP2025-F21-DEGURBA-Cities_Pop',
              'source_page':'https://population.un.org/wup/downloads?tab=Cities',
              'sheets':[{'sheet':x['sheet'],'header_row':x['header_row'],'record_count':len(x['records'])} for x in found],
              'city_count_ge_50k_mid_2025':len(records),
              'duplicate_country_city_keys':dup,
              'contains_ottawa':True,
              'contains_toronto':True,
              'sha256':hashlib.sha256(open(path,'rb').read()).hexdigest(),
              'bytes':os.path.getsize(path)
          }
          if dup: raise SystemExit(f'duplicate country/city keys: {dup}')
          json.dump(report,open('/tmp/wup/city-universe-report.json','w'),indent=2)
          print(json.dumps(report,indent=2))
          PY
      - name: Hash source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,glob,os
          out=[]
          for p in sorted(glob.glob('/tmp/wup/*')):
              if os.path.isfile(p): out.append({'file':os.path.basename(p),'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),'bytes':os.path.getsize(p)})
          json.dump(out,open('/tmp/wup/source-manifest.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vidik-wup-city-universe-audit
          path: /tmp/wup/*
          retention-days: 30
