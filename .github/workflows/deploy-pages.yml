name: Deploy VIDIK Mobile Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate mobile web payload
        run: |
          test -f index.html
          test -f styles.css
          test -f js/bootstrap.js
          for i in $(seq -w 1 10); do test -f "data/census-${i}.b64"; done

      - name: Upload VIDIK web artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy VIDIK Mobile Web
        id: deployment
        uses: actions/deploy-pages@v4
