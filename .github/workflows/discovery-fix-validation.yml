name: VIDIK Discovery Fix Validation
on:
  push:
    branches: [fix/discovery-relevance-domain-firewall]
jobs:
  discovery-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Debug UK heat discovery
        run: |
          node - <<'NODE'
          const {discoverSourceDrivenInterventions}=require('./js/source-driven-intervention-discovery');
          const source={sourceId:'uk-open-data-program-discovery',jurisdiction:'UK',domain:'intervention-universe',url:'https://example.test'};
          const records=[
            {id:'0',title:'Urban cooling centre service',notes:'Public cooling service during extreme heat.'},
            {id:'1',title:'Cool-roof retrofit grant program',notes:'Grant funding for heat-reducing building retrofits.'},
            {id:'2',title:'Heat exposure statistics report',notes:'Population statistics and monitoring data.'}
          ];
          const body=Buffer.from(JSON.stringify({result:{results:records}}));
          discoverSourceDrivenInterventions({problem:'reduce urban heat exposure',jurisdiction:'UK',sources:[source],fetchImpl:async()=>({ok:true,status:200,headers:{get:k=>k==='content-type'?'application/json':null},arrayBuffer:async()=>body})})
            .then(r=>console.log(JSON.stringify({candidates:r.candidates.map(x=>x.name),searches:r.sourceSearches.map(s=>({queries:s.queriesAttempted,attempts:s.attempts.map(a=>({q:a.query,n:a.candidatesReturned,status:a.status}))}))},null,2)));
          NODE
      - name: Novel relevance
        run: node --test tests/intervention-relevance-novel-problems.test.js
      - name: Blind jurisdiction discovery
        run: node --test tests/blind-jurisdiction-discovery.test.js
      - name: Full intelligence generalization
        run: node tests/intelligence-generalization.test.js
