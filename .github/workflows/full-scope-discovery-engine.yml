name: full-scope-discovery-engine
on:
  push:
    branches: [main]
    paths:
      - 'src/full-scope/discovery-engine.js'
      - 'tests/full-scope-discovery-engine.test.js'
      - '.github/workflows/full-scope-discovery-engine.yml'
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node tests/full-scope-discovery-engine.test.js
