name: VIDIK Canonical 60-Problem Discovery Baseline
on:
  push:
    branches: ["fix/data-acquisition-timeout-scope"]
  workflow_dispatch:
concurrency:
  group: vidik-discovery-60-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discovery-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install declared dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
        timeout-minutes: 5
      - name: Run canonical 60-problem discovery baseline
        shell: bash
        run: |
          set -o pipefail
          timeout --foreground --kill-after=30s 25m node --test tests/discovery-quality-60-baseline.test.js 2>&1 | tee discovery-60-baseline.log
        timeout-minutes: 26
      - name: Preserve baseline output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidik-discovery-60-baseline-${{ github.sha }}
          path: discovery-60-baseline.log
          if-no-files-found: warn
          retention-days: 14
