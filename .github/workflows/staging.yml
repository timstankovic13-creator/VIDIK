name: Staging Health and Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  staging-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:e2e
      - name: Verify canonical files
        run: test -s index.html && test -s js/engine.js && test -s js/decision-intelligence-9.2.js && test -s js/decision-intelligence-9.2.1-hardening.js
      - name: Recovery smoke test
        run: node -e "const fs=require('fs'); for (const p of ['index.html','js/engine.js','js/bootstrap.js']) if(!fs.existsSync(p)) process.exit(1); console.log('recovery-artifact-check: PASS')"
