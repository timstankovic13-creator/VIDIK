name: VIDIK Intelligence Completion v1
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, intelligence-completion-v1]
concurrency:
  group: vidik-intelligence-completion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  intelligence-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Keep the deterministic Insight Quality preflight before any network, database,
      # browser, or full-battery work. A discovery regression should fail in seconds,
      # not after consuming the production validation path.
      - name: Insight Quality fast preflight
        run: node --test tests/insight-quality-fast-gate.test.js
      - name: PR trigger architecture lock
        run: node --test tests/pr-ci-trigger-architecture.test.js
      - name: Intervention universe hardening
        run: node --test tests/intelligence-completion-intervention-universe.test.js tests/intelligence-completion-arbitrary-problem.integration.test.js tests/intelligence-generalization-blind-tournament.test.js tests/outsider-adversarial-hardening-v2.test.js tests/source-driven-intervention-discovery.test.js
      - name: Intervention relevance scenario battery
        run: node --test tests/intervention-relevance-scenarios.test.js
      - name: Evidence sufficiency hardening
        run: node --test tests/intelligence-completion-evidence-sufficiency.test.js tests/source-driven-evidence-discovery.test.js tests/evidence-promotion-gate.test.js tests/evidence-acquisition-orchestrator.test.js
      - name: Quantitative evidence-to-decision bridge
        run: node tests/decision-quantification-bridge.test.js && node tests/vidik-resource-optimization.test.js && node tests/independent-evidence-parameter-verification.test.js
      - name: Production intelligence 1-7 certification
        run: node --test tests/production-intelligence-certification.test.js
      - name: Canonical production integration
        run: node --test tests/canonical-production-intelligence-integration.test.js
      - name: Open-world production closed loop
        run: node tests/open-world-production-closed-loop.test.js
      - name: Blind open-world tournament
        run: node tests/blind-open-world-tournament.test.js
      - name: Production boundary hardening
        run: node tests/production-boundary-hardening.test.js
      - name: Core discovery regression
        run: node tests/decision-discovery-execution.test.js && node tests/decision-discovery-orchestrator.test.js
      - name: Broad arbitrary-problem battery
        run: node --test tests/open-world-problem-battery.test.js tests/arbitrary-problem-discovery-battery.test.js tests/unseen-problem-discovery-certification.test.js
      - name: Full scope regression
        run: node --test tests/vidik-full-scope-functional.test.js
      - name: Live arbitrary-problem finish-line validation
        run: npm run test:production-finish-line
      - name: Decision artifact integrity and persistence
        run: npm run test:decision-artifact-store
      - name: Outcome learning and drift persistence
        run: npm run test:outcome-learning
      - name: Decision-to-outcome lifecycle closure
        run: npm run test:decision-lifecycle-closure
      - name: Operational review and governance lifecycle
        run: npm run test:operational-governance
      - name: Operational learning loop certification
        run: node --test tests/operational-learning-loop.test.js
      - name: Audit replay and export integrity
        run: node --test tests/audit-replay-export.test.js
      - name: Production readiness certification
        run: node --test tests/production-readiness.test.js
      - name: Production deployment evidence contract
        run: node --test tests/production-deployment-evidence.test.js
      - name: Managed persistence and tenant authorization
        run: npm run test:managed-persistence
      - name: Production deployment verifier
        run: node --test tests/production-deployment-verifier.test.js
      - name: Product usage gamut
        run: npm run test:product-usage-gamut
      - name: Insight Quality Battery (60 real-world decision problems)
        run: npm run test:insight-quality-battery
      - name: Nonmunicipal workspace integration
        run: npm run test:nonmunicipal-workspace

  production-postgres-acceptance:
    name: Real PostgreSQL production acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Real PostgreSQL lifecycle, tenant isolation, and audit acceptance
        run: timeout --foreground --kill-after=10s 45s node --test tests/production-postgres-integration.test.js
        env:
          VIDIK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
