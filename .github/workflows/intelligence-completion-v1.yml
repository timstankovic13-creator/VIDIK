name: VIDIK Intelligence Completion v1
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, intelligence-completion-v1]
jobs:
  intelligence-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Intervention universe hardening
        run: node --test tests/intelligence-completion-intervention-universe.test.js tests/intelligence-completion-arbitrary-problem.integration.test.js tests/intelligence-generalization-blind-tournament.test.js tests/outsider-adversarial-hardening-v2.test.js tests/source-driven-intervention-discovery.test.js
      - name: Intervention relevance scenario battery
        run: node --test tests/intervention-relevance-scenarios.test.js
      - name: Evidence sufficiency hardening
        run: node --test tests/intelligence-completion-evidence-sufficiency.test.js tests/source-driven-evidence-discovery.test.js tests/evidence-promotion-gate.test.js tests/evidence-acquisition-orchestrator.test.js
      - name: Quantitative evidence-to-decision bridge
        run: node tests/decision-quantification-bridge.test.js && node tests/vidik-resource-optimization.test.js && node tests/independent-evidence-parameter-verification.test.js
      - name: Production intelligence 1-7 certification
        run: node --test tests/production-intelligence-certification.test.js
      - name: Canonical production integration
        run: node --test tests/canonical-production-intelligence-integration.test.js
      - name: Open-world production closed loop
        run: node tests/open-world-production-closed-loop.test.js
      - name: Blind open-world tournament
        run: node tests/blind-open-world-tournament.test.js
      - name: Core discovery regression
        run: node tests/decision-discovery-execution.test.js && node tests/decision-discovery-orchestrator.test.js
      - name: Full scope regression
        run: node --test tests/vidik-full-scope-functional.test.js
