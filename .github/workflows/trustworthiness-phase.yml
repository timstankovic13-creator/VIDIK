name: VIDIK Trustworthiness Phase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trustworthiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Trustworthiness adversarial suite
        run: npm run test:trustworthiness-phase
      - name: Existing discovery regression
        run: npm run test:intervention-discovery
      - name: Existing learning regression
        run: npm run test:outcome-learning
      - name: Existing production artifact/integrity regressions
        run: |
          npm run test:municipal-decision-integrity
          npm run test:canonical-production-integration
