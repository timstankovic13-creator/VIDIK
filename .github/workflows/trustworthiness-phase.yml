name: VIDIK Trustworthiness Phase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 20

jobs:
  candidate-matching:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Candidate matching and discovery
        run: node --test --test-name-pattern='^(1|2) ' tests/trustworthiness-phase.test.js

  evidence-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Evidence contradiction and invalidation
        run: node --test --test-name-pattern='^(3|4) ' tests/trustworthiness-phase.test.js

  replay-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Historical replay and sensitivity
        run: node --test --test-name-pattern='^(5|6) ' tests/trustworthiness-phase.test.js

  transportability-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Transportability and drift
        run: node --test --test-name-pattern='^(7|8) ' tests/trustworthiness-phase.test.js

  arbitrary-problems:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Arbitrary problem and comparable-city learning
        run: node --test --test-name-pattern='^(9|10) ' tests/trustworthiness-phase.test.js

  certification-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Certification and artifact contract
        run: node --test --test-name-pattern='^(production certification|artifact projection)' tests/trustworthiness-phase.test.js

  discovery-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Arbitrary-problem discovery orchestration
        run: npm run test:decision-discovery-orchestration

  existing-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Existing discovery regression
        run: npm run test:intervention-discovery
      - name: Existing learning regression
        run: npm run test:outcome-learning
      - name: Existing production artifact/integrity regressions
        run: |
          npm run test:municipal-decision-integrity
          npm run test:canonical-production-integration

  extended-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Acquisition and discovery stack
        run: |
          npm run test:data-acquisition
          npm run test:acquisition-canonical-integration
          npm run test:source-acquisition-runner
          npm run test:evidence-acquisition-orchestrator
          npm run test:source-registry
          npm run test:research-discovery
      - name: Decision intelligence and production hardening
        run: |
          npm run test:municipal-evidence-pipeline
          npm run test:municipal-semantic-gates
          npm run test:resource-optimization
          npm run test:production-hardening-a-d
          npm run test:architecture-completeness
      - name: Multi-city evidence and independent verification
        run: |
          npm run test:three-city-architecture
          npm run test:real-three-city-evidence
          npm run test:independent-evidence-verification
