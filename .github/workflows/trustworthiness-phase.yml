name: VIDIK Trustworthiness Phase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trustworthiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Candidate matching and discovery
        run: node --test tests/trustworthiness-phase.test.js --test-name-pattern='^(1|2) '
      - name: Evidence contradiction and invalidation
        run: node --test tests/trustworthiness-phase.test.js --test-name-pattern='^(3|4) '
      - name: Historical replay and sensitivity
        run: node --test tests/trustworthiness-phase.test.js --test-name-pattern='^(5|6) '
      - name: Transportability and drift
        run: node --test tests/trustworthiness-phase.test.js --test-name-pattern='^(7|8) '
      - name: Arbitrary problem and comparable-city learning
        run: node --test tests/trustworthiness-phase.test.js --test-name-pattern='^(9|10) '
      - name: Certification and artifact contract
        run: node --test tests/trustworthiness-phase.test.js --test-name-pattern='^(production certification|artifact projection)'
      - name: Existing discovery regression
        run: npm run test:intervention-discovery
      - name: Existing learning regression
        run: npm run test:outcome-learning
      - name: Existing production artifact/integrity regressions
        run: |
          npm run test:municipal-decision-integrity
          npm run test:canonical-production-integration
