name: VIDIK Live Municipal Experiments

on:
  push:
    branches:
      - feat/live-city-experiments
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  municipal-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run live three-city experiment suite
        run: node scripts/municipal-experiment-runner.js
