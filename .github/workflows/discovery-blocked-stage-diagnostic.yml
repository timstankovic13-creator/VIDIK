name: Discovery Blocked Stage Diagnostic

on:
  pull_request:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test tests/discovery-blocked-stage-diagnostic.test.js
