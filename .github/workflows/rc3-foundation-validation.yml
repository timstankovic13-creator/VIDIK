name: VIDIK RC3 Foundation Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rc3-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: RC3, RC4 and RC2 Node suites
        run: >-
          node --test
          tests/rc3-decision-experiment.test.js
          tests/rc3-case-experiments-002-003.test.js
          tests/rc3-case-experiments-004-014.test.js
          tests/rc3-first-real-experiments.test.js
          tests/rc3-execution-records.test.js
          tests/rc3-execution-plans-004-014.test.js
          tests/rc3-real-acquisition-004-014.test.js
          tests/rc3-experiment-endpoint-audit.test.js
          tests/rc3-final-experiment-closeout.test.js
          tests/rc4-four-stream-execution.test.js
          tests/rc4-four-stream-analysis.test.js
          tests/rc4-minimum-sufficient-evidence.test.js
          tests/rc4-public-evidence-experiment.test.js
          tests/rc4-experiment-final-run.test.js
          tests/rc2-evidence-governance.test.js
          tests/rc2-evidence-acquisition.test.js
          tests/rc2-stress-and-learning.test.js
          tests/rc2-cases-004-012-gate.test.js
          tests/rc2-final-readiness.test.js

  rc3-browser:
    needs: rc3-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Full Playwright regression
        run: npx playwright test --reporter=line
