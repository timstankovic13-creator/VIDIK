name: VIDIK Architecture Completeness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  architecture-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run canonical architecture and comparable-city contract
        run: npm run test:architecture-completeness
