name: Blind 30 Budget Optimization Final
on:
  push:
    branches: [ blind-30-budget-optimization-v1 ]
  workflow_dispatch:
jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test tests/blind-30-budget-optimization-v1.test.js
      - run: node tests/decision-quantification-bridge.test.js
      - run: node tests/vidik-resource-optimization.test.js
