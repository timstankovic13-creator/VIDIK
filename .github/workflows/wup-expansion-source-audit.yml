name: WUP Expansion Source Audit
on:
  push:
    branches:
      - feat/live-municipal-adapters-wup-expansion
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Audit authoritative 2025 settlement entity source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pandas geopandas
          python3 - <<'PY'
          import io, zipfile
          from pathlib import Path
          import requests
          import pandas as pd
          import geopandas as gpd

          url=('https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/'
               'GHS_WUP_DEGURBA_GLOBE_R2025A/'
               'GHS_WUP_DEGURBA_E2025_GLOBE_R2025A_54009_1000/'
               'V1-0/GHS_WUP_DEGURBA_E2025_GLOBE_R2025A_54009_1000_V1_0.zip')
          print('Downloading verified WUP-DEGURBA archive:', url)
          r=requests.get(url,timeout=300); r.raise_for_status()
          z=zipfile.ZipFile(io.BytesIO(r.content)); names=z.namelist()
          shp_names=[n for n in names if n.lower().endswith('.shp')]
          print('Archive member count:',len(names)); print('Shapefile members:',*shp_names,sep='\n - ')
          if not shp_names: raise SystemExit('wup-no-shapefiles-in-verified-archive')
          out=Path('/tmp/wup-audit'); out.mkdir(exist_ok=True); z.extractall(out)
          shps=list(out.rglob('*.shp')); print('Extracted shapefiles:',[str(p.relative_to(out)) for p in shps])
          for shp in shps:
              label=shp.stem.upper(); df=gpd.read_file(shp)
              cols={str(c).upper():c for c in df.columns}
              pop=next((cols[k] for k in ('POP','POP2025','POP_2025','E2025_POP','POP_E2025') if k in cols),None)
              if not pop: raise SystemExit(f'wup-population-field-not-found:{label}:columns={list(df.columns)}')
              vals=pd.to_numeric(df[pop],errors='coerce'); sub=(vals>0)&(vals<50000)
              print(f'\n=== {label} ===')
              print('rows=',len(df),'positive=',int((vals>0).sum()),'sub50k=',int(sub.sum()),'pop_field=',pop)
              print('columns=',list(df.columns))
              # Identify likely classification/category fields and show their sub-50k counts.
              for c in df.columns:
                  u=str(c).upper()
                  if u in {'POP','POP2025','POP_2025','E2025_POP','POP_E2025','GEOMETRY'}: continue
                  s=df.loc[sub,c].dropna().astype(str)
                  if s.empty: continue
                  nun=s.nunique()
                  if nun<=100:
                      vc=s.value_counts().head(30)
                      print(f'CATEGORY {c} unique={nun} sub50k_count={len(s)}')
                      for k,v in vc.items():
                          marker='  <-- 4690' if int(v)==4690 else ''
                          print(f'  {k!r}: {int(v)}{marker}')
              # Numeric threshold diagnostics that could explain the historical contract.
              for c in df.columns:
                  u=str(c).upper()
                  if u==str(pop).upper(): continue
                  num=pd.to_numeric(df[c],errors='coerce')
                  if num.notna().sum()>0 and num.nunique(dropna=True)<=100:
                      counts=[]
                      for value in sorted(num.dropna().unique()):
                          n=int(((num==value)&sub).sum())
                          if n: counts.append((value,n))
                      if counts:
                          print(f'NUMERIC-CATEGORY {c}: {counts[:50]}')
          print('\nWUP classification audit complete. No 4690 assertion has been added.')
          PY