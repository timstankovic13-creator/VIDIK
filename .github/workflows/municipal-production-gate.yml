name: VIDIK Municipal Production Gate

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  municipal-production-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install
        run: npm install
      - name: Production hardening A-D
        run: npm run test:production-hardening-a-d
      - name: Municipal adapter contracts
        run: npm run test:municipal-contracts
      - name: Municipal semantic decision gates
        run: npm run test:municipal-semantic-gates
      - name: Three-city production decision acceptance
        run: npm run test:municipal-decision-run
      - name: Five-phase production decision integrity challenge
        run: npm run test:municipal-decision-integrity
      - name: Resource-to-outcome optimization feedback phases 1-5
        run: npm run test:resource-optimization
      - name: Three-city end-to-end architecture validation
        run: npm run test:three-city-architecture
      - name: Full production experiment suite
        run: node scripts/municipal-experiment-runner.js
      - name: Generate inspectable three-city decision artifact
        run: node scripts/municipal-production-decision-artifact.js
        env:
          VIDIK_DECISION_ARTIFACT: artifacts/municipal-three-city-production-decision.json
      - name: Validate inspectable three-city decision artifact
        run: node tests/municipal-production-decision-artifact.test.js
      - name: Publish three-city decision artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidik-three-city-production-decision
          path: artifacts/municipal-three-city-production-decision.json
          if-no-files-found: error
      - name: Municipal hostile production gate
        run: npm run test:municipal-production
      - name: Municipal live ingestion
        run: npm run test:municipal-live
      - name: Municipal operational lifecycle
        run: npm run test:municipal-operational-lifecycle
      - name: Municipal retrospective shadow
        run: npm run test:municipal-retrospective-shadow
      - name: Hostile engine and production readiness
        run: npm run test:hostile-readiness
