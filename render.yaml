services:
  - type: web
    name: vidik-staging
    runtime: node
    region: ohio
    plan: free
    branch: main
    buildCommand: echo 'VIDIK staging: no build step'
    startCommand: node staging/server.js
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: VIDIK_DATABASE_URL
        fromDatabase:
          name: vidik-staging-db
          property: connectionString

databases:
  - name: vidik-staging-db
    plan: free
    region: ohio
    postgresMajorVersion: 15
    databaseName: vidik_staging_db
    user: vidik_staging_db_user
