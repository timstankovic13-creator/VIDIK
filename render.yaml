services:
  - type: web
    name: vidik-staging-app
    runtime: node
    region: ohio
    plan: free
    branch: main
    buildCommand: echo 'VIDIK staging: no build step'
    startCommand: node staging/server.js
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: VIDIK_DATABASE_URL
        fromDatabase:
          name: vidik-staging-db
          property: connectionString
